<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized - WeApRous</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .error-icon {
            font-size: 4rem;
            color: #dc2626;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 3rem;
            font-weight: 700;
            color: #dc2626;
            margin: 0;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #374151;
            margin: 0.5rem 0 1rem;
        }
        .error-message {
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        .info-box {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            text-align: left;
        }
        .info-box h4 {
            color: #92400e;
            margin: 0 0 0.5rem;
            font-size: 1rem;
        }
        .info-box p {
            color: #92400e;
            margin: 0;
            font-size: 0.9rem;
        }
        .info-box code {
            background: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">🔒</div>
        <h1 class="error-code">401</h1>
        <h2 class="error-title">Unauthorized Access</h2>
        <p class="error-message">
            You need to be authenticated to access this resource. 
            Please log in with valid credentials to continue.
        </p>
        
        <div class="actions">
            <a href="/login" class="btn btn-primary">
                🔑 Sign In
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                ← Go Back
            </button>
        </div>
        
        <div class="info-box">
            <h4>📝 Test Credentials</h4>
            <p>
                Username: <code>admin</code><br>
                Password: <code>password</code>
            </p>
        </div>
    </div>

    <script>
        // Auto-redirect to login after 10 seconds
        let countdown = 10;
        const countdownEl = document.createElement('div');
        countdownEl.style.cssText = 'margin-top: 1rem; color: #6b7280; font-size: 0.9rem;';
        countdownEl.innerHTML = `Auto-redirecting to login in <span id="timer">${countdown}</span> seconds...`;
        document.querySelector('.container').appendChild(countdownEl);
        
        const timer = setInterval(() => {
            countdown--;
            document.getElementById('timer').textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = '/login';
            }
        }, 1000);
        
        // Clear timer if user navigates away
        window.addEventListener('beforeunload', () => clearInterval(timer));
    </script>
</body>
</html>
