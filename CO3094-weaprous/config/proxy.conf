# Chat Servers (Task 2) - Single Instance
host "chat.local" {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://127.0.0.1:8000;
}

# Chat Servers (Task 2) - LAN Access
host "10.128.9.159:8000" {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://10.128.9.159:8000;
}

# Chat Servers Load Balanced (Task 2) - Multiple Instances  
host "chat-lb.local" {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://127.0.0.1:8000;
    proxy_pass http://127.0.0.1:8001;
    proxy_pass http://127.0.0.1:8002;

    dist_policy round-robin
}

# Chat Servers Load Balanced (Task 2) - LAN Access
host "10.128.9.159:8082" {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://10.128.9.159:8000;
    proxy_pass http://10.128.9.159:8001;
    proxy_pass http://10.128.9.159:8002;

    dist_policy round-robin
}

